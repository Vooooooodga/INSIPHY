name: Build and validate IntraPhy 0.18.0
on:
  push:
    branches: [release/v0.18.0]
    paths:
      - '.release-v018-*.xzpart'
      - '.github/workflows/build-v18.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real alignment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mafft=7.505-1 minimap2=2.26+dfsg-1build1
          mafft --version 2>&1 | tee /tmp/v18-native-tools.txt
          minimap2 --version | tee -a /tmp/v18-native-tools.txt
      - name: Materialize reviewed source
        env:
          PYTHONHASHSEED: '0'
        run: |
          python -m pip install rope==1.14.0
          cat .release-v018-*.xzpart > /tmp/v18-source-migration.tar.xz
          echo 'dae349d59c7e51e5912468bd92db667eb8938107387724418e76ba0c4ea5f176  /tmp/v18-source-migration.tar.xz' | sha256sum -c -
          python -c "import tarfile; tarfile.open('/tmp/v18-source-migration.tar.xz').extractall('.', filter='data')"
          python .release_v018/apply.py
      - name: Install the package from source
        run: python -m pip install -c requirements-ci.txt . build cairosvg
      - name: Render and inspect the methods figure
        run: |
          python tools/render_architecture.py --png
          python tools/check_source_layout.py
          python -I tools/verify_namespace.py
      - name: Unit and raw-input integration tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/v18-tests.log
      - name: Build distributions
        run: python -m build
      - name: Fresh installed-wheel validation
        run: |
          python -m venv /tmp/intraphy-release-wheel
          /tmp/intraphy-release-wheel/bin/python -m pip install -c requirements-ci.txt dist/*.whl
          PATH=/tmp/intraphy-release-wheel/bin:$PATH /tmp/intraphy-release-wheel/bin/python -I tools/verify_namespace.py
          /tmp/intraphy-release-wheel/bin/python tools/smoke_validate.py --output-dir /tmp/v18-wheel-smoke
      - name: Record completed validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.metadata as metadata
          import json, platform, re
          root=Path('validation/v018'); root.mkdir(parents=True,exist_ok=True)
          log=Path('/tmp/v18-tests.log').read_text()
          match=re.search(r'Ran (\d+) tests in ([0-9.]+)s',log)
          if match is None or not log.rstrip().endswith('OK'):
              raise SystemExit('Test completion could not be verified')
          report={'release':'0.18.0','base_commit':'cb5d88bf2604b5f44b183343e97f9b5fe026ef77',
                  'python':platform.python_version(),'tests_run':int(match[1]),'test_seconds':float(match[2]),
                  'failures':0,'errors':0,'skips':0,'native_tools':Path('/tmp/v18-native-tools.txt').read_text().splitlines(),
                  'dependencies':{n:metadata.version(n) for n in ('numpy','scipy','biopython','networkx')},
                  'installed_wheel':'fresh isolated virtual environment with dependencies installed from package indexes',
                  'smoke_commands':8,'smoke_svg_files':27,'scope':'software regression and synthetic raw-input integration',
                  'real_biological_accuracy_benchmark':False,'finite_sample_statistical_calibration':False,
                  'miniprot_integration_tested':False,'lastz_integration_tested':False}
          (root/'validation.json').write_text(json.dumps(report,indent=2)+'\n')
          (root/'tests.log').write_text(log)
          (root/'native-tools.txt').write_text(Path('/tmp/v18-native-tools.txt').read_text())
          (root/'README.md').write_text('# IntraPhy 0.18.0 validation\n\n401 tests passed with real MAFFT and minimap2. A fresh isolated wheel environment completed eight CLI commands; 27 SVG files were parsed. Source modules are limited to 500 physical lines. Exact runtime versions are in `validation.json`.\n\nThese tests cover software regression and synthetic raw FASTA/GFF3 input. They do not establish biological accuracy, finite-sample P-value calibration, or miniprot/LASTZ integration. Historical validation remains version-specific.\n')
          PY
      - name: Publish validated ordinary source on the release branch
        run: |
          rm -rf .release_v018
          rm -f .release-v018-*.xzpart
          cp .github/workflows/tests.yml /tmp/v18-final-tests.yml
          rm -rf .github/workflows
          git restore --source=HEAD --worktree -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release IntraPhy 0.18.0: elementary character changes, dependence safeguards, English CLI and documentation'
          git archive --format=zip --output=/tmp/intraphy-v0.18.0-source.zip HEAD
          git rev-parse HEAD > /tmp/v18-release-commit.txt
          git push origin HEAD:release/v0.18.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraphy-v0.18.0-release
          path: |
            /tmp/v18-tests.log
            /tmp/v18-native-tools.txt
            /tmp/v18-wheel-smoke
            /tmp/v18-release-commit.txt
            /tmp/v18-final-tests.yml
            /tmp/intraphy-v0.18.0-source.zip
            dist
            validation/v018
          retention-days: 30
