name: Publish IntraPhy V19
on:
  push:
    branches: [main]
    paths:
      - '.github/v19.patch'
      - '.github/workflows/publish-v19.yml'
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      EXPECTED_BASE: c8be72b1f676551cde796b02b32f0333b700907c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify publication baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE"...HEAD | sort)" = "$(printf '.github/v19.patch\\n.github/workflows/publish-v19.yml\\n' | sort)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Apply exact V19 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/v19.patch
          git apply .github/v19.patch
          git rm .github/v19.patch .github/workflows/publish-v19.yml
          grep -q 'version = "0.19.0"' pyproject.toml
      - name: Install native alignment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mafft minimap2
          mafft --version
          minimap2 --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python 3.13 complete validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c requirements-ci.txt . build
          python tools/check_source_layout.py
          python -I tools/verify_namespace.py
          python -m unittest discover -s tests -v
          python tools/validate_v19.py --output-dir validation/current/v19-raw-py313
          rm -rf dist build
          python -m build
          python -m venv /tmp/intraphy-v19-wheel
          /tmp/intraphy-v19-wheel/bin/python -m pip install -c requirements-ci.txt dist/*.whl
          PATH=/tmp/intraphy-v19-wheel/bin:$PATH /tmp/intraphy-v19-wheel/bin/python -I tools/verify_namespace.py
          /tmp/intraphy-v19-wheel/bin/python tools/smoke_validate.py --output-dir validation/current/wheel-smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python 3.10 regression validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c requirements-ci.txt .
          python -m unittest discover -s tests -v
          python tools/validate_v19.py --output-dir validation/current/v19-raw-py310
      - name: Publish tested V19 to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name "IntraPhy release"
          git config user.email "57168144+Vooooooodga@users.noreply.github.com"
          git add -A
          git commit -m "Release IntraPhy 0.19: exon configuration evolution"
          git push origin HEAD:main
