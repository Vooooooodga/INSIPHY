name: Publish IntraPhy 0.19.1
on:
  push:
    branches: [main]
    paths:
      - '.github/v0191.ready'
      - '.github/workflows/publish-v19.yml'
permissions:
  contents: write
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      EXPECTED_BASE: c8be72b1f676551cde796b02b32f0333b700907c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify publication baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test -f .github/v19.patch
          test -f .github/v0191.ready
          compgen -G '.github/v0191.part*.patch' >/dev/null
      - name: Apply staged releases
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/v19.patch
          git apply .github/v19.patch
          cat .github/v0191.part*.patch > /tmp/v0191.patch
          git apply --check /tmp/v0191.patch
          git apply /tmp/v0191.patch
          grep -q 'version = "0.19.1"' pyproject.toml
          git rm -f AGENTS.md
          sed -i 's/ AGENTS\.md//' MANIFEST.in
          git checkout "$GITHUB_SHA" -- .github/workflows/tests.yml .github/workflows/publish-v19.yml
          mkdir -p docs/figures/legacy_v018
          for stem in architecture homology_inference method_overview phylogenetic_model; do
            for ext in svg png; do
              test -f "docs/figures/${stem}.${ext}" && cp "docs/figures/${stem}.${ext}" "docs/figures/legacy_v018/${stem}.${ext}"
            done
          done
          git rm -f .github/v19.patch .github/v0191.ready .github/v0191.part*.patch
          ! grep -RInE --exclude='*.png' --exclude='*.pdf' --exclude='*.svg' --exclude='*.zip' --exclude='*.whl' --exclude='*.gz' '(AGENTS\.md|\b(ChatGPT|OpenAI|Codex|Claude|LLM|large language model|artificial intelligence|AI[- ]generated|AI assistant|assistant-generated)\b)' . --exclude-dir=.git
      - name: Install native alignment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mafft minimap2
          mafft --version
          minimap2 --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python 3.13 validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c requirements-ci.txt . build cairosvg
          python tools/render_method_figures.py --output-dir docs/figures --png
          python tools/check_source_layout.py
          python -I tools/verify_namespace.py
          python -m unittest discover -s tests -v
          python tools/validate_v19.py --output-dir validation/current/v0191-raw-py313
          python tools/validate_v0191.py --output-dir validation/current/v0191-audit-py313
          rm -rf dist build
          python -m build
          python -m venv /tmp/intraphy-v0191-wheel
          /tmp/intraphy-v0191-wheel/bin/python -m pip install -c requirements-ci.txt dist/*.whl
          PATH=/tmp/intraphy-v0191-wheel/bin:$PATH /tmp/intraphy-v0191-wheel/bin/python -I tools/verify_namespace.py
          /tmp/intraphy-v0191-wheel/bin/python tools/smoke_validate.py --output-dir validation/current/wheel-smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python 3.10 regression validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c requirements-ci.txt .
          python -m unittest discover -s tests -v
          python tools/validate_v19.py --output-dir validation/current/v0191-raw-py310
          python tools/validate_v0191.py --output-dir validation/current/v0191-audit-py310
      - name: Publish tested 0.19.1 to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name "IntraPhy release"
          git config user.email "57168144+Vooooooodga@users.noreply.github.com"
          ! grep -RInE --exclude='*.png' --exclude='*.pdf' --exclude='*.svg' --exclude='*.zip' --exclude='*.whl' --exclude='*.gz' '(AGENTS\\.md|\\b(ChatGPT|OpenAI|Codex|Claude|LLM|large language model|artificial intelligence|AI[- ]generated|AI assistant|assistant-generated)\\b)' . --exclude-dir=.git
          git add -A
          git commit -m "Release IntraPhy 0.19.1"
          git push origin HEAD:main
