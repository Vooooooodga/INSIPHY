<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title description"><title id="title">IntraPhy: phylogenetic analysis of local gene structure</title><desc id="description">Genome sequence and supplied annotation support local correspondence. A frozen matrix separates DNA presence, exon identity and splice junctions. Parsimony reports elementary changes; known dependence blocks independent CTMC fitting.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D6373" /></marker></defs><rect width="1500" height="1120" fill="white" /><text x="52" y="58" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="bold" text-anchor="start">IntraPhy</text><text x="253" y="58" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start">Phylogenetic analysis of local gene structure</text><text x="53" y="94" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start">Sequence evidence → structural characters → conditional reconstruction</text><rect x="50" y="125" width="420" height="405" rx="12" fill="#F8FBFD" stroke="#B7C8D2" stroke-width="1.5" /><rect x="50" y="125" width="420" height="59" rx="12" fill="#007F86" stroke="#007F86" stroke-width="1.5" /><text x="73" y="164" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start">A</text><text x="110" y="163" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Input and annotation</text><rect x="540" y="125" width="420" height="405" rx="12" fill="#F8FBFD" stroke="#B7C8D2" stroke-width="1.5" /><rect x="540" y="125" width="420" height="59" rx="12" fill="#315A9B" stroke="#315A9B" stroke-width="1.5" /><text x="563" y="164" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start">B</text><text x="600" y="163" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Local correspondence</text><rect x="1030" y="125" width="420" height="405" rx="12" fill="#F8FBFD" stroke="#B7C8D2" stroke-width="1.5" /><rect x="1030" y="125" width="420" height="59" rx="12" fill="#007F86" stroke="#007F86" stroke-width="1.5" /><text x="1053" y="164" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start">C</text><text x="1090" y="163" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Structural characters</text><text x="73" y="222" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start">Single-copy orthologous genes</text><text x="73" y="258" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Genome FASTA + GFF3 / GTF</text><text x="73" y="287" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Supplied rooted species tree</text><line x1="75" y1="315" x2="444" y2="315" stroke="#B7C8D2" /><text x="73" y="350" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start">Retain native structure</text><text x="73" y="386" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Exons, CDS / UTR and introns</text><text x="73" y="415" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Strand and genomic coordinates</text><text x="73" y="444" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">All supplied transcript paths</text><text x="73" y="501" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Annotation remains observation-dependent.</text><text x="563" y="222" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start">Complementary evidence</text><text x="563" y="258" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Protein alignment → codon projection</text><text x="563" y="287" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">DNA alignment in bounded intervals</text><text x="563" y="316" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Unique flanks + local order</text><text x="563" y="376" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start">Resolve actual aligned blocks</text><text x="563" y="412" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Distinguish fragments from repeats</text><text x="563" y="441" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Retain alternative correspondences</text><text x="563" y="470" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Unresolved evidence stays unknown</text><text x="563" y="501" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start">A reference sequence is not an ancestor.</text><polyline points="474,328 535,328" fill="none" stroke="#4D6373" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" /><polyline points="964,328 1025,328" fill="none" stroke="#4D6373" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" /><text x="1053" y="215" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">DNA presence</text><text x="1053" y="243" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">present / absent</text><text x="1053" y="287" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Exon identity</text><text x="1053" y="315" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">exonic / non-exonic</text><text x="1053" y="359" fill="#172B3A" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Splice junction</text><text x="1053" y="387" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">present / absent</text><text x="1053" y="445" fill="#007F86" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start">Unknown ≠ absent</text><text x="1053" y="477" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">DNA absence makes exon role inapplicable.</text><text x="1053" y="501" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Flanking exons do not prove whole-intron homology.</text><rect x="50" y="565" width="1400" height="89" rx="12" fill="#EAF4F5" stroke="#7FAFB3" stroke-width="1.5" /><text x="750" y="600" fill="#007F86" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">Character catalogue + frozen observation matrix</text><text x="750" y="632" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">Actual intervals · state definitions · dependence · observation masks · complete coordinates retained</text><polyline points="1240,535 1240,560" fill="none" stroke="#4D6373" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" /><polyline points="397,655 397,700" fill="none" stroke="#4D6373" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" /><polyline points="1103,655 1103,700" fill="none" stroke="#4D6373" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" /><rect x="50" y="706" width="685" height="262" rx="12" fill="#F8FBFD" stroke="#B7C8D2" stroke-width="1.5" /><rect x="765" y="706" width="685" height="262" rx="12" fill="#FBFAF6" stroke="#B7C8D2" stroke-width="1.5" /><text x="75" y="748" fill="#315A9B" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start">D  Maximum parsimony</text><text x="75" y="782" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Default · fixed rooted tree · equal transition costs</text><text x="75" y="827" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">All globally optimal states and branch placements</text><text x="75" y="859" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Required / possible elementary character changes</text><text x="75" y="891" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start">One compatible minimum-change reconstruction</text><text x="75" y="942" fill="#315A9B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="start">Alternative placements are not added as events.</text><text x="790" y="748" fill="#906315" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start">E  Conditional CTMC analysis</text><text x="790" y="782" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start">Optional · same matrix and tree · ER / ARD / foreground</text><text x="790" y="827" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Known linked included characters → no independent fit</text><text x="790" y="859" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Valid fits only: rates, model tests and conditional states</text><text x="790" y="891" fill="#4D6373" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start">Finite-sample calibration remains unassessed</text><text x="790" y="942" fill="#906315" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Model-test significance does not validate a named event.</text><polyline points="397,970 397,1003" fill="none" stroke="#4D6373" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" /><polyline points="1103,970 1103,1003" fill="none" stroke="#4D6373" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="none" /><rect x="50" y="1008" width="1400" height="79" rx="12" fill="#172B3A" stroke="#172B3A" stroke-width="1.5" /><text x="750" y="1040" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">Local evidence, elementary changes and target-specific structural histories</text><text x="750" y="1070" fill="#D7E6EE" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle">No inferred mutation-event total · no compound events · no complete ancestral transcript or mechanism</text></svg>