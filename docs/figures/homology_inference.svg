<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="970" viewBox="0 0 1600 970" data-model="exon_configuration_v2"><title>Exon homology and atomic annotation alternatives</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="30.00" y="38.00" font-size="25" text-anchor="start" >How exon correspondence and annotation uncertainty enter the analysis</text>
<text x="30.00" y="67.00" font-size="14" text-anchor="start" >Current implementation: one genomic alignment with coding cross-checks, not joint integration over all alignments.</text>
