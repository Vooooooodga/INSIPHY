<text x="75.00" y="610.00" font-size="12" text-anchor="start" >One-to-many complementary correspondence</text>
<line x1="425.00" y1="469.00" x2="645.00" y2="469.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="425.00" y="461.00" width="220.00" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
<line x1="380.00" y1="568.00" x2="700.00" y2="568.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="380.00" y="560.00" width="142.22" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
<rect x="557.78" y="560.00" width="142.22" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
