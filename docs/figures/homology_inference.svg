<line x1="620.00" y1="480.00" x2="650.00" y2="551.00" stroke="#AE6746" stroke-width="1.5" stroke-dasharray=""/>
<text x="410.00" y="521.00" font-size="12" text-anchor="start" >Competing matches of the same interval</text>
<text x="390.00" y="610.00" font-size="12" text-anchor="start" >Retain ambiguity; no copy history inferred</text>
<rect x="805.00" y="391.00" width="765.00" height="247.00" fill="#F7F9FA" stroke="#294353" stroke-dasharray="" />
<text x="823.00" y="422.00" font-size="20" text-anchor="start" >C   Compare complete alternative annotations</text>
<line x1="865.00" y1="475.00" x2="1295.00" y2="475.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="865.00" y="467.00" width="143.33" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
<rect x="1080.00" y="467.00" width="215.00" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
<text x="1315.00" y="480.00" font-size="13" text-anchor="start" >GFF structure</text>
<line x1="865.00" y1="544.00" x2="1295.00" y2="544.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="865.00" y="536.00" width="430.00" height="16.00" fill="none" stroke="#294353" stroke-dasharray="5,3" />
<text x="1315.00" y="549.00" font-size="13" text-anchor="start" >candidate</text>
<text x="843.00" y="589.00" font-size="14" text-anchor="start" >Require matched exon sequence, location flanks and preserved cut context.</text>
<text x="843.00" y="619.00" font-size="14" text-anchor="start" >The original GFF is not rewritten; candidates carry a source and evidence.</text>
<rect x="30.00" y="663.00" width="1540.00" height="244.00" fill="#F7F9FA" stroke="#294353" stroke-dasharray="" />
<text x="48.00" y="694.00" font-size="20" text-anchor="start" >D   Report how the conclusion depends on annotation</text>
<text x="77.00" y="736.00" font-size="19" text-anchor="start" >Same synthetic DNA; one annotation is split</text>
<text x="77.00" y="781.00" font-size="18" text-anchor="start" >Exact GFF condition: minimum edits = 1</text>
<text x="77.00" y="823.00" font-size="18" text-anchor="start" >Allow the sequence-supported whole-exon candidate: minimum edits = 0</text>
<text x="930.00" y="746.00" font-size="17" text-anchor="start" >This is annotation sensitivity, not proof that</text>
<text x="930.00" y="779.00" font-size="17" text-anchor="start" >the more parsimonious annotation is correct.</text>
<text x="930.00" y="827.00" font-size="14" text-anchor="start" >Assembly gaps and missing search context remain unknown.</text>
<text x="30.00" y="941.00" font-size="14" text-anchor="start" >Thresholds qualify candidates; they are not calibrated probabilities of homology or biological correctness.</text></g></svg>
