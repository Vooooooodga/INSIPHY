<text x="860.00" y="154.00" font-size="16" text-anchor="start" >FASTA and GFF are kept in a reversible coordinate system.</text>
<text x="860.00" y="194.00" font-size="16" text-anchor="start" >MAFFT: genomic columns; coding projection: conflict check.</text>
<text x="860.00" y="234.00" font-size="16" text-anchor="start" >minimap2: competing copies and orientation candidates.</text>
<text x="860.00" y="274.00" font-size="16" text-anchor="start" >Unannotated terminal DNA is not cropped from the search.</text>
<text x="860.00" y="323.00" font-size="13" text-anchor="start" >CESAR2 remains a separate optional prediction adapter.</text>
<rect x="30.00" y="391.00" width="750.00" height="247.00" fill="#F7F9FA" stroke="#294353" stroke-dasharray="" />
<text x="48.00" y="422.00" font-size="20" text-anchor="start" >B   Distinguish complementary coverage from competing copies</text>
<line x1="75.00" y1="469.00" x2="320.00" y2="469.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="75.00" y="461.00" width="245.00" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
