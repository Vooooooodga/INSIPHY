<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1315" viewBox="0 0 1680 1315" data-purpose="synthetic-teaching-schematic"><title>How are homologous regions identified?</title><desc>Exon boundaries may differ. Compare sequences first, then evaluate their genomic positions. Original synthetic example; not a biological validation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202D38" /></marker><pattern id="missing" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF8EA" /><path d="M0 7L7 0" stroke="#B97716" stroke-width=".7" /></pattern></defs><rect x="0" y="0" width="1680" height="1315" fill="white" stroke="none" rx="0" stroke-width="1.4" stroke-dasharray="none" /><text x="48" y="49" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start">How are homologous regions identified?</text><text x="48" y="83" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Exon boundaries may differ. Compare sequences first, then evaluate their genomic positions.</text><text x="48" y="1293" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">SYNTHETIC EXAMPLE  |  Genomic distances are schematic  |  IntraPhy 0.18</text><text x="48" y="142" fill="#168577" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">1</text><text x="82" y="142" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Generate and project sequence alignments</text><text x="82" y="204" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Protein-coding regions</text><text x="82" y="237" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">MAFFT protein alignment</text><text x="82" y="263" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Project residues through codons to genomic coordinates</text><text x="87" y="310" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Species A</text><text x="230" y="310" fill="#202D38" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" text-anchor="start">K L V A D  E F G</text><line x1="386" y1="287" x2="386" y2="316" stroke="#7554A3" stroke-width="3" stroke-dasharray="none" /><text x="87" y="368" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Species B</text><text x="230" y="368" fill="#202D38" font-family="DejaVu Sans Mono, monospace" font-size="21" font-weight="400" text-anchor="start">K L I A D  E F G</text><line x1="386" y1="345" x2="386" y2="374" stroke="#7554A3" stroke-width="3" stroke-dasharray="none" /><text x="86" y="414" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Aligned residues establish a common coordinate system.</text><line x1="787" y1="190" x2="787" y2="425" stroke="#B4C0C7" stroke-width="1" stroke-dasharray="none" /><text x="833" y="204" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Genomic DNA, including unannotated intervals</text><text x="833" y="237" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">minimap2 finds candidate nucleotide matches.</text><text x="833" y="263" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Unique flanking matches delimit local realignment.</text><text x="833" y="326" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Annotated region</text><line x1="995" y1="321" x2="1320" y2="321" stroke="#202D38" stroke-width="1" stroke-dasharray="none" /><rect x="1007" y="309" width="60" height="23" fill="#E3E8EB" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="1100" y="309" width="110" height="23" fill="#168577" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="1248" y="309" width="62" height="23" fill="#E3E8EB" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><text x="833" y="391" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Target genome</text><line x1="995" y1="386" x2="1320" y2="386" stroke="#202D38" stroke-width="1" stroke-dasharray="none" /><rect x="1007" y="374" width="60" height="23" fill="#E3E8EB" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="1100" y="374" width="110" height="23" fill="#168577" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="1248" y="374" width="62" height="23" fill="#E3E8EB" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><path d="M1100 332C1100 353.0 1100 353.0 1100 374L1210 374C1210 353.0 1210 353.0 1210 332Z" fill="#168577" stroke="none" fill-opacity=".20" data-evidence="matched-subinterval-only" /><text x="833" y="424" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Bounded short alignments use affine-gap dynamic programming.</text><line x1="48" y1="455" x2="1630" y2="455" stroke="#B4C0C7" stroke-width="1" stroke-dasharray="none" /><text x="48" y="499" fill="#168577" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">2</text><text x="82" y="499" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Select compatible matches; retain unresolved alternatives</text><text x="82" y="545" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Complementary coverage: a split or fused exon</text><rect x="114" y="585" width="95" height="25" fill="#168577" stroke="none" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="209" y="585" width="95" height="25" fill="#7554A3" stroke="none" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="114" y="585" width="190" height="25" fill="none" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><path d="M114 610C114 647.5 114 647.5 114 685L209 685C209 647.5 209 647.5 209 610Z" fill="#168577" stroke="none" fill-opacity=".20" data-evidence="matched-subinterval-only" /><path d="M209 610C209 647.5 243 647.5 243 685L338 685C338 647.5 304 647.5 304 610Z" fill="#7554A3" stroke="none" fill-opacity=".20" data-evidence="matched-subinterval-only" /><rect x="114" y="685" width="95" height="25" fill="#168577" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="243" y="685" width="95" height="25" fill="#7554A3" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><line x1="209" y1="698" x2="243" y2="698" stroke="#202D38" stroke-width="2" stroke-dasharray="none" /><text x="375" y="600" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Distinct, ordered parts of the same region.</text><text x="375" y="626" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The same correspondence works in reverse:</text><text x="375" y="652" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">split versus fused is not a direction of evolution.</text><text x="850" y="545" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Repeated coverage: do not force a one-to-one match</text><rect x="897" y="585" width="112" height="25" fill="#168577" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><path d="M897 610C897 647.5 847 647.5 847 685L959 685C959 647.5 1009 647.5 1009 610Z" fill="#168577" stroke="none" fill-opacity=".20" data-evidence="matched-subinterval-only" /><path d="M897 610C897 647.5 1037 647.5 1037 685L1149 685C1149 647.5 1009 647.5 1009 610Z" fill="#168577" stroke="none" fill-opacity=".20" data-evidence="matched-subinterval-only" /><rect x="847" y="685" width="112" height="25" fill="#168577" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><rect x="1037" y="685" width="112" height="25" fill="#168577" stroke="#202D38" rx="0" stroke-width="1.4" stroke-dasharray="none" /><text x="1210" y="622" fill="#B97716" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">Alternative locations</text><text x="1210" y="650" fill="#B97716" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">remain ambiguous.</text><rect x="82" y="745" width="1516" height="205" fill="#F4F7F8" stroke="none" rx="5" stroke-width="1.4" stroke-dasharray="none" /><text x="104" y="779" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Ordered-chain dynamic programming</text><line x1="210" y1="867" x2="420" y2="831" stroke="#168577" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" /><line x1="570" y1="831" x2="785" y2="867" stroke="#168577" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" /><line x1="210" y1="867" x2="420" y2="904" stroke="#168577" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" /><line x1="570" y1="904" x2="785" y2="867" stroke="#168577" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" /><rect x="114" y="852" width="116" height="30" fill="white" stroke="#168577" rx="3" stroke-width="1.4" stroke-dasharray="none" /><text x="172.0" y="873" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Left flank</text><rect x="417" y="816" width="160" height="30" fill="white" stroke="#168577" rx="3" stroke-width="1.4" stroke-dasharray="none" /><text x="497.0" y="837" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Match 1</text><rect x="417" y="889" width="160" height="30" fill="white" stroke="#168577" rx="3" stroke-width="1.4" stroke-dasharray="none" /><text x="497.0" y="910" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Match 2</text><rect x="785" y="852" width="126" height="30" fill="white" stroke="#168577" rx="3" stroke-width="1.4" stroke-dasharray="none" /><text x="848.0" y="873" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">Right flank</text><text x="980" y="821" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Connect matches with compatible order and strand.</text><text x="980" y="853" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Find the chain with the largest sum of match scores.</text><text x="980" y="885" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Keep near-optimal alternatives: no forced copy choice.</text><line x1="48" y1="978" x2="1630" y2="978" stroke="#B4C0C7" stroke-width="1" stroke-dasharray="none" /><text x="48" y="1020" fill="#168577" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">3</text><text x="82" y="1020" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">When an exon is missing from the annotation</text><text x="90" y="1066" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">DNA match in the expected interval</text><line x1="165" y1="1133" x2="385" y2="1133" stroke="#202D38" stroke-width="1.5" stroke-dasharray="none" /><rect x="190" y="1127" width="170" height="12" fill="#168577" stroke="none" rx="0" stroke-width="1.4" stroke-dasharray="none" /><text x="90" y="1190" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Sequence present; exonic status unknown*.</text><text x="90" y="1215" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">* No informative transcript annotation.</text><text x="633" y="1066" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Deletion supported</text><text x="633" y="1086" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">by flanks and alignment</text><line x1="708" y1="1133" x2="928" y2="1133" stroke="#202D38" stroke-width="1.5" stroke-dasharray="none" /><line x1="758" y1="1126" x2="770" y2="1140" stroke="#168577" stroke-width="2" stroke-dasharray="none" /><line x1="773" y1="1126" x2="785" y2="1140" stroke="#168577" stroke-width="2" stroke-dasharray="none" /><text x="633" y="1190" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Sequence absent; exonic status inapplicable.</text><text x="1170" y="1066" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Assembly gap or competing matches</text><line x1="1245" y1="1133" x2="1465" y2="1133" stroke="#202D38" stroke-width="1.5" stroke-dasharray="none" /><rect x="1270" y="1122" width="170" height="22" fill="url(#missing)" stroke="#B97716" rx="0" stroke-width="1.4" stroke-dasharray="6 4" /><text x="1170" y="1190" fill="#B97716" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Unknown; no confirmed loss.</text></svg>