<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" data-purpose="synthetic-teaching-schematic"><title>IntraPhy | Reconstructing changes in gene structure</title><desc>Genome sequences + gene annotations + a rooted species tree, for a set of single-copy orthologs. Original synthetic example; not a biological validation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202D38" /></marker><pattern id="missing" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#FFF8EA" /><path d="M0 7L7 0" stroke="#B97716" stroke-width=".7" /></pattern></defs><rect x="0" y="0" width="1800" height="820" fill="white" stroke="none" rx="0" stroke-width="1.4" stroke-dasharray="none" /><text x="48" y="49" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" text-anchor="start">IntraPhy | Reconstructing changes in gene structure</text><text x="48" y="83" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Genome sequences + gene annotations + a rooted species tree, for a set of single-copy orthologs.</text><text x="48" y="798" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">SYNTHETIC EXAMPLE  |  Genomic distances are schematic  |  IntraPhy 0.18</text><text x="48" y="142" fill="#168577" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">1</text><text x="82" y="142" fill="#202D38" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start">Identify homologous regions</text><text x="82" y="171" fill="#576875" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sequence alignment and genomic context</text><text x="648" y="1