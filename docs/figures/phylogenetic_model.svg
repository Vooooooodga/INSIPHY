<text x="1030.00" y="525.00" font-size="17" text-anchor="start" >Ancestral configurations are unobserved.</text>
<text x="1030.00" y="562.00" font-size="17" text-anchor="start" >Pruning sums over all legal ancestral states.</text>
<text x="1030.00" y="608.00" font-size="15" text-anchor="start" >Node labels: conditional state probabilities.</text>
<text x="1030.00" y="647.00" font-size="15" text-anchor="start" >An uncertain tip allows compatible states;</text>
<text x="1030.00" y="675.00" font-size="15" text-anchor="start" >it is not forced to a missing exon.</text>
<text x="1030.00" y="733.00" font-size="15" text-anchor="start" >The most probable marginal states need not</text>
<text x="1030.00" y="759.00" font-size="15" text-anchor="start" >form one most probable joint history.</text>
<rect x="30.00" y="851.00" width="1540.00" height="177.00" fill="#F7F9FA" stroke="#294353" stroke-dasharray="" />
<text x="48.00" y="882.00" font-size="20" text-anchor="start" >D   Three different quantities for the branch CD → D</text>
<text x="80.00" y="925.00" font-size="18" text-anchor="start" >P(different endpoints) = 0.5885</text>
<text x="615.00" y="925.00" font-size="18" text-anchor="start" >P(at least one edit) = 0.6125</text>
<text x="1150.00" y="925.00" font-size="18" text-anchor="start" >Expected edits = 0.6622</text>
<text x="80.00" y="990.00" font-size="14" text-anchor="start" >All values are calculated by this version of IntraPhy; full rates, states, observations and outputs accompany the figures.</text></g></svg>
