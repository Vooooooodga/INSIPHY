<line x1="311.20" y1="726.00" x2="540.00" y2="726.00" stroke="#647583" stroke-width="1.5" stroke-dasharray=""/>
<text x="548.00" y="530.00" font-size="14" text-anchor="start" >A</text>
<text x="548.00" y="597.00" font-size="14" text-anchor="start" >B</text>
<text x="548.00" y="664.00" font-size="14" text-anchor="start" >C</text>
<text x="548.00" y="731.00" font-size="14" text-anchor="start" >D</text>
<line x1="650.00" y1="525.00" x2="960.00" y2="525.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="650.00" y="517.00" width="310.00" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
