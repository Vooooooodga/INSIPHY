<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1060" viewBox="0 0 1600 1060" data-model="exon_configuration_v2"><title>Exon configurations and their conditional CTMC history</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="30.00" y="39.00" font-size="26" text-anchor="start" >From exon configurations to a phylogenetic probability model</text>
<text x="30.00" y="69.00" font-size="14" text-anchor="start" >One local object, several possible structures. Example rates are fixed teaching values, not biological estimates.</text>
<rect x="30.00" y="92.00" width="640.00" height="334.00" fill="#F7F9FA" stroke="#294353" stroke-dasharray="" />
<text x="48.00" y="123.00" font-size="20" text-anchor="start" >A   Define structures and the edits that connect them</text>
<line x1="80.00" y1="186.00" x2="330.00" y2="186.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="80.00" y="178.00" width="250.00" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
<line x1="80.00" y1="321.00" x2="330.00" y2="321.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/>
<rect x="80.00" y="313.00" width="83.33" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
<rect x="205.00" y="313.00" width="125.00" height="16.00" fill="#427788" stroke="#294353" stroke-dasharray="" />
<text x="385.00" y="190.00" font-size="18" text-anchor="start" >One exon</text>
<text x="385.00" y="325.00" font-size="18" text-anchor="start" >Two exons</text>
<line x1="170.00" y1="211.00" x2="170.00" y2="286.00" stroke="#2B5361" stroke-width="1.5" stroke-dasharray=""/>
<line x1="175.00" y1="277.00" x2="170.00" y2="286.00" stroke="#647583" stroke-width="1.5" stroke-dasharray=""/>
<line x1="165.00" y1="277.00" x2="170.00" y2="286.00" stroke="#647583" stroke-width="1.5" stroke-dasharray=""/>
<line x1="210.00" y1="286.00" x2="210.00" y2="211.00" stroke="#2B5361" stroke-width="1.5" stroke-dasharray=""/>
<line x1="205.00" y1="220.00" x2="210.00" y2="211.00" stroke="#647583" stroke-width="1.5" stroke-dasharray=""/>
<line x1="215.00" y1="220.00" x2="210.00" y2="211.00" stroke="#647583" stroke-width="1.5" stroke-dasharray=""/>
<text x="145.00" y="242.00" font-size="15" text-anchor="end" >split</text>
<text x="145.00" y="263.00" font-size="13" text-anchor="end" >rate = 0.7</text>
<text x="240.00" y="242.00" font-size="15" text-anchor="start" >fusion</text>
<text x="240.00" y="263.00" font-size="13" text-anchor="start" >rate = 0.7</text>
<text x="80.00" y="377.00" font-size="13" text-anchor="start" >Reverse fusion has its own rate. Other legal edits remain in the model.</text>
<text x="80.00" y="403.00" font-size="13" text-anchor="start" >Full declared catalogue: 5 states; not only observed endpoints.</text>
<rect x="698.00" y="92.00" width="872.00" height="334.00" fill="#F7F9FA" stroke="#294353" stroke-dasharray="" />
<text x="716.00" y="123.00" font-size="20" text-anchor="start" >B   Build a transition process from these same edits</text>
<text x="735.00" y="169.00" font-size="19" text-anchor="start" >Each arrow connects two concrete exon configurations.</text>
<text x="735.00" y="217.00" font-size="20" text-anchor="start" >q(S, S′) = sum of rates for allowed edits from S to S′</text>
<text x="735.00" y="265.00" font-size="25" text-anchor="start" >P(t) = exp(Q t)</text>
<text x="735.00" y="303.00" font-size="15" text-anchor="start" >Branch length controls the time available for zero, one or multiple edits.</text>
<text x="735.00" y="343.00" font-size="15" text-anchor="start" >An insertion or deletion includes its structural consequences only once.</text>
<text x="735.00" y="382.00" font-size="14" text-anchor="start" >This is a finite opportunity model, not a DNA-repair mechanism model.</text>
<rect x="30.00" y="450.00" width="1540.00" height="379.00" fill="#F7F9FA" stroke="#294353" stroke-dasharray="" />
<text x="48.00" y="481.00" font-size="20" text-anchor="start" >C   Combine observed tip structures with the species tree</text>
<line x1="100.00" y1="625.50" x2="100.00" y2="558.50" stroke="#647583" stroke-width="1.5" stroke-dasharray=""/>
