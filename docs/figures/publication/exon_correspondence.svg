<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="59.66mm" viewBox="0 0 1780 590"><title>Sequence correspondence and structural observations</title><desc>Genomic and coding-projection evidence support ordered correspondence hypotheses. DNA present with unknown exon status, supported DNA absence, and unresolved conflicts are shown as distinct outcomes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20313D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="42.00" y="46.00" font-size="43.2" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Sequence correspondence and structural observations</text><text x="42.00" y="76.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">A shared coordinate system is conditional on qualified sequence evidence</text><text x="55.00" y="131.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">A   Genomic locus</text><text x="55.00" y="160.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">annotated exons</text><line x1="62.00" y1="217.00" x2="562.00" y2="217.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="82.00" y="205.00" width="100.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="217.00" y="205.00" width="70.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="407.00" y="205.00" width="55.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="497.00" y="205.00" width="55.00" height="24.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><text x="55.00" y="190.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">genomic DNA</text><text x="55.00" y="387.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">coding alignment → genome</text><line x1="62.00" y1="346.00" x2="562.00" y2="346.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="82.00" y="338.50" width="100.00" height="15.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="217.00" y="338.50" width="70.00" height="15.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="407.00" y="338.50" width="55.00" height="15.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="497.00" y="338.50" width="55.00" height="15.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><line x1="182" y1="217" x2="182" y2="345" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><line x1="302" y1="217" x2="302" y2="345" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><line x1="412" y1="217" x2="412" y2="345" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><line x1="507" y1="217" x2="507" y2="345" stroke="#B87923" stroke-width="2" stroke-dasharray=""/><text x="61.00" y="425.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">collinear sequence blocks</text><line x1="580" y1="280" x2="632" y2="280" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="650.00" y="131.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">B   Ordered candidate chain</text><text x="650.00" y="159.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">compatible order and strand</text><rect x="670" y="220" width="126" height="42" rx="5" fill="white" stroke="#356B78" stroke-width="1.5"/><text x="733.00" y="249.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif">Flank</text><rect x="834" y="220" width="126" height="42" rx="5" fill="white" stroke="#356B78" stroke-width="1.5"/><text x="897.00" y="249.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif">Path A</text><rect x="834" y="302" width="126" height="42" rx="5" fill="white" stroke="#356B78" stroke-width="1.5"/><text x="897.00" y="331.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif">Path B</text><rect x="1000" y="260" width="126" height="42" rx="5" fill="white" stroke="#356B78" stroke-width="1.5"/><text x="1063.00" y="289.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif">Flank</text><line x1="796" y1="241" x2="834" y2="241" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="796" y1="241" x2="834" y2="323" stroke="#356B78" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="960" y1="241" x2="1000" y2="281" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="960" y1="323" x2="1000" y2="281" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="650.00" y="379.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Alternative compatible chains</text><line x1="1138" y1="280" x2="1180" y2="280" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="1190.00" y="131.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C   Tip observations</text><rect x="1190" y="171" width="542" height="88" rx="5" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1210.00" y="227.00" font-size="36.800000000000004" text-anchor="start" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">?</text><text x="1250.00" y="210.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">DNA present</text><text x="1250.00" y="246.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">exon status unknown</text><rect x="1190" y="268" width="542" height="88" rx="5" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1210.00" y="324.00" font-size="36.800000000000004" text-anchor="start" fill="#B87923" font-family="Arial, sans-serif" font-weight="600">∅</text><text x="1250.00" y="307.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">DNA absent</text><text x="1250.00" y="343.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">paired flanks qualify</text><rect x="1190" y="365" width="542" height="88" rx="5" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1210.00" y="421.00" font-size="36.800000000000004" text-anchor="start" fill="#A34F4F" font-family="Arial, sans-serif" font-weight="600">!</text><text x="1250.00" y="404.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">copy / strand / alignment</text><text x="1250.00" y="440.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">conflict unresolved</text><line x1="42" y1="473" x2="1732" y2="473" stroke="#CBD3D7" stroke-width="1" stroke-dasharray=""/><text x="48.00" y="514.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Compatible alternatives retain complete exon configurations.</text><text x="48.00" y="544.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Correspondence is conditional on sequence qualification.</text></g></svg>
