<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="113.13mm" viewBox="0 0 1790 1125"><title>Ancestral-state reconstruction on a supplied tree</title><desc>Panel A shows local tip observations on a supplied rooted species tree. Panel B shows child conditional-likelihood messages flowing toward the root under sum-product pruning, with a root-weighted likelihood sum. Panel C shows minimum-cost parsimony. Panel D shows pooled likelihood fitting of one shared scale across a prespecified collection of at least two independent genes while relative rates, roots and trees are fixed. Panel E shows sensitivity to declared assumptions. Transition rates and branch summaries condition on the declared generator, root conditions and tree. Observation likelihoods use compatibility constraints conditional on supplied annotation coverage. Transcript-detection and ascertainment models are not fitted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20313D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="42.00" y="50.00" font-size="44.800000000000004" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Ancestral-state reconstruction on a supplied tree</text><text x="42.00" y="87.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Local configurations or declared repertoires are the modeled states</text><rect x="42" y="120" width="515" height="525" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="66.00" y="163.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">A   Tree + tip observations</text><line x1="86" y1="265" x2="86" y2="385" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="86" y1="265" x2="146.2" y2="265" stroke="#20313D" stroke-wi