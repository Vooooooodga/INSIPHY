00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="379.55" y="286.00" width="47.30" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="463.40" y="286.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><line x1="252.7" y1="355" x2="300" y2="355" stroke="#CBD3D7" stroke-width="1.5" stroke-dasharray=""/><line x1="300.00" y1="355.00" x2="515.00" y2="355.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="308.60" y="346.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="379.55" y="346.00" width="47.30" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="463.40" y="346.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><line x1="252.7" y1="415" x2="300" y2="415" stroke="#CBD3D7" stroke-width="1.5" stroke-dasharray=""/><line x1="300.00" y1="415.00" x2="515.00" y2="415.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="308.60" y="406.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="379.55" y="406.00" width="47.30" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="463.40" y="406.00" width="43.00" height="18.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><text x="66.00" y="510.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Tip compatibility</text><text x="66.00" y="548.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Root, topology and branch lengths</text><text x="66.00" y="582.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">are supplied model conditions</text><rect x="590" y="120" width="1158" height="525" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="614.00" y="163.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">B   Continuous-time conditional likelihood</text><line x1="655" y1="281" x2="655" y2="401" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="655" y1="281" x2="736.2" y2="281" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="655" y1="401" x2="736.2" y2="401" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="251" x2="736.2" y2="311" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="371" x2="736.2" y2="431" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="251" x2="823.2" y2="251" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="311" x2="823.2" y2="311" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="371" x2="823.2" y2="371" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><line x1="736.2" y1="431" x2="823.2" y2="431" stroke="#20313D" stroke-width="2" stroke-dasharray=""/><text x="831.20" y="257.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">A</text><text x="831.20" y="317.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">B</text><text x="831.20" y="377.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">C</text><text x="831.20" y="437.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">D</text><line x1="818.2" y1="245" x2="744.2" y2="245" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="818.2" y1="319" x2="744.2" y2="319" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="818.2" y1="364" x2="744.2" y2="364" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="818.2" y1="439" x2="744.2" y2="439" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="732.2" y1="272" x2="663" y2="272" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="732.2" y1="410" x2="663" y2="410" stroke="#72558A" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arrow)"/><text x="932.00" y="222.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Tip observations define compatibility weights</text><text x="932" y="267" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">m</tspan><tspan font-size="19.6" dy="8.4">c</tspan><tspan font-size="28.0" dy="-8.4">(i) = Σ</tspan><tspan font-size="19.6" dy="8.4">j</tspan><tspan font-size="28.0" dy="-8.4"> P</tspan><tspan font-size="19.6" dy="8.4">ij</tspan><tspan font-size="28.0" dy="-8.4">(t</tspan><tspan font-size="19.6" dy="8.4">c</tspan><tspan font-size="28.0" dy="-8.4">) L</tspan><tspan font-size="19.6" dy="8.4">c</tspan><tspan font-size="28.0" dy="-8.4">(j)</tspan></text><text x="932" y="315" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">L</tspan><tspan font-size="19.6" dy="8.4">v</tspan><tspan font-size="28.0" dy="-8.4">(i) = ∏</tspan><tspan font-size="19.6" dy="8.4">c∈children(v)</tspan><tspan font-size="28.0" dy="-8.4"> m</tspan><tspan font-size="19.6" dy="8.4">c</tspan><tspan font-size="28.0" dy="-8.4">(i)</tspan></text><text x="932" y="363" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">ℒ = Σ</tspan><tspan font-size="19.6" dy="8.4">i</tspan><tspan font-size="28.0" dy="-8.4"> π</tspan><tspan font-size="19.6" dy="8.4">i</tspan><tspan font-size="28.0" dy="-8.4"> L</tspan><tspan font-size="19.6" dy="8.4">root</tspan><tspan font-size="28.0" dy="-8.4">(i)</tspan></text><text x="932.00" y="421.00" font-size="28" text-anchor="start" fill="#72558A" font-family="Arial, sans-serif" font-weight="600">P(t) = exp(Qt)</text><text x="932.00" y="472.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Child messages combine by sum-product</text><text x="932.00" y="508.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Node outputs: marginal ancestral states</text><text x="932.00" y="544.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Branches: conditional event expectations</text><rect x="42" y="690" width="530" height="260" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="66.00" y="733.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C   Maximum parsimony</text><circle cx="135" cy="812" r="30" fill="#F2F5F6" stroke="#356B78" stroke-width="2"/><text x="135.00" y="819.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₁</text><circle cx="300" cy="812" r="30" fill="#F2F5F6" stroke="#356B78" stroke-width="2"/><text x="300.00" y="819.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₂</text><circle cx="465" cy="812" r="30" fill="#F2F5F6" stroke="#356B78" stroke-width="2"/><text x="465.00" y="819.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₃</text><line x1="165" y1="812" x2="270" y2="812" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="330" y1="812" x2="435" y2="812" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="66.00" y="884.00" font-size="28" text-anchor="start" fill="#356B78" font-family="Arial, sans-serif">Minimize edit cost; retain ties</text><rect x="630" y="690" width="530" height="260" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="654.00" y="733.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">D   Shared-rate estimation</text><text x="654.00" y="786.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">≥2 independent genes</text><text x="654.00" y="824.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Pooled likelihood; one scale ρ</text><text x="654.00" y="860.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Relative rates · roots · trees fixed</text><text x="654.00" y="903.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Prespecified independent genes</text><rect x="1218" y="690" width="530" height="260" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="1242.00" y="733.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">E   Assumption sensitivity</text><text x="1242.00" y="786.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Recalculate across declared</text><text x="1242.00" y="824.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">root-state distributions</text><text x="1242.00" y="860.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">branch lengths or catalogues</text><text x="1242.00" y="903.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Conditional structural summaries</text><text x="48" y="990" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">q</tspan><tspan font-size="19.6" dy="8.4">ij</tspan><tspan font-size="28.0" dy="-8.4"> = ρ Σ</tspan><tspan font-size="19.6" dy="8.4">e:i→j</tspan><tspan font-size="28.0" dy="-8.4"> λ</tspan><tspan font-size="19.6" dy="8.4">k(e)</tspan><tspan font-size="28.0" dy="-8.4"> w</tspan><tspan font-size="19.6" dy="8.4">e</tspan><tspan font-size="28.0" dy="-8.4">  (i ≠ j)</tspan></text><text x="48" y="1027" font-size="28" fill="#72558A" font-family="Arial, sans-serif" font-weight="600"><tspan font-size="28.0" dy="0.0">q</tspan><tspan font-size="19.6" dy="8.4">ii</tspan><tspan font-size="28.0" dy="-8.4"> = −Σ</tspan><tspan font-size="19.6" dy="8.4">j≠i</tspan><tspan font-size="28.0" dy="-8.4"> q</tspan><tspan font-size="19.6" dy="8.4">ij</tspan></text><text x="48.00" y="1063.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">ρ is one shared scale; λ are fixed relative event rates; w allocates outcomes.</text><text x="48.00" y="1098.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Tip constraints depend on annotation coverage; molecular mechanisms are outside this model.</text></g></svg>
