<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="57.32mm" viewBox="0 0 1790 570"><title>Local structural states and observation constraints</title><desc>Panel A defines an ordered exon configuration on genomic material. Panel B defines a local structural repertoire: coexisting configurations map injectively to distinct members, while tip observations constrain a lower bound and allow additional members. Panel C shows compatibility weights; fully unknown observations have weight one for every admissible state, with known material-presence constraints retained. Panel D closes the finite state space over candidate exon boundaries and admissible edits.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20313D"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20313D"><text x="42.00" y="46.00" font-size="43.2" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Local structural states and observation constraints</text><text x="42.00" y="77.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Ordered local exon structures on shared genomic material</text><rect x="45" y="120" width="500" height="280" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="68.00" y="158.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">A   Exon configuration C</text><text x="75.00" y="217.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₁</text><line x1="126.00" y1="211.00" x2="466.00" y2="211.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="139.60" y="197.50" width="91.80" height="27.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="292.60" y="197.50" width="78.20" height="27.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><rect x="391.20" y="197.50" width="61.20" height="27.00" fill="#356B78" stroke="#294353" stroke-dasharray="" /><text x="75.00" y="282.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₂</text><line x1="126.00" y1="276.00" x2="466.00" y2="276.00" stroke="#A5B0B8" stroke-width="1.5" stroke-dasharray=""/><rect x="139.60" y="262.50" width="91.80" height="27.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><rect x="292.60" y="262.50" width="159.80" height="27.00" fill="#72558A" stroke="#294353" stroke-dasharray="" /><text x="68.00" y="338.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">[a b]  ↔  [a]—[b]</text><text x="68.00" y="365.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Ordered exon intervals</text><rect x="582" y="120" width="520" height="280" rx="8" fill="white" stroke="#CBD3D7" stroke-width="1.5"/><text x="605.00" y="158.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">B   Local repertoire R</text><text x="607.00" y="196.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">R = {C₁, C₂} on m</text><text x="608.00" y="248.00" font-size="28" text-anchor="start" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">AND</text><text x="695.00" y="248.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">coexisting structures</text><text x="695.00" y="280.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Distinct members</text><text x="608.00" y="316.00" font-size="28" text-anchor="start" fill="#B87923" font-family="Arial, sans-serif" font-weight="600">OR</text><text x="695.00" y="316.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">complete alternatives</text><text x="608.00" y="351.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Observation sets a lower bound</text><text x="608.00" y="384.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">additional members may occur</text><rect x="1140" y="120" width="602" height="280" rx="8" fill="#F2F5F6" stroke="#CBD3D7" stroke-width="1.5"/><text x="1163.00" y="158.00" font-size="30.400000000000002" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C   Tip compatibility</text><text x="1163.00" y="198.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Allowed states</text><circle cx="1190" cy="252" r="25" fill="white" stroke="#356B78" stroke-width="2"/><text x="1190.00" y="258.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₁</text><text x="1190.00" y="309.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">1</text><circle cx="1315" cy="252" r="25" fill="white" stroke="#356B78" stroke-width="2"/><text x="1315.00" y="258.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₂</text><text x="1315.00" y="309.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">1</text><circle cx="1440" cy="252" r="25" fill="white" stroke="#356B78" stroke-width="2"/><text x="1440.00" y="258.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₃</text><text x="1440.00" y="309.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">1</text><circle cx="1565" cy="252" r="25" fill="white" stroke="#356B78" stroke-width="2"/><text x="1565.00" y="258.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">…</text><text x="1565.00" y="309.00" font-size="28" text-anchor="middle" fill="#356B78" font-family="Arial, sans-serif" font-weight="600">1</text><text x="1163.00" y="342.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif">Fully unknown → all weights 1</text><text x="1163.00" y="378.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">Known DNA presence retained</text><line x1="42" y1="411" x2="1742" y2="411" stroke="#CBD3D7" stroke-width="1" stroke-dasharray=""/><text x="48.00" y="453.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">D   Candidate exon boundaries</text><text x="48.00" y="482.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">observed + supported candidates</text><line x1="545" y1="465" x2="640" y2="465" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="670.00" y="453.00" font-size="28.8" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">admissible closure</text><text x="670.00" y="482.00" font-size="28" text-anchor="start" fill="#637580" font-family="Arial, sans-serif">reachable states</text><circle cx="1015" cy="450" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1015.00" y="456.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₁</text><circle cx="1155" cy="450" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1155.00" y="456.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₂</text><circle cx="1085" cy="520" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1085.00" y="526.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">C₃</text><circle cx="1235" cy="520" r="20" fill="#F2F5F6" stroke="#72558A" stroke-width="2"/><text x="1235.00" y="526.00" font-size="28" text-anchor="middle" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">…</text><line x1="1035" y1="450" x2="1135" y2="450" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="1168" y1="466" x2="1100" y2="504" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="1105" y1="520" x2="1215" y2="520" stroke="#20313D" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="1320.00" y="468.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Finite state space</text><text x="1320.00" y="506.00" font-size="28" text-anchor="start" fill="#20313D" font-family="Arial, sans-serif" font-weight="600">Conditional on catalogue</text></g></svg>
