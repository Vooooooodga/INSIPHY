[project]
name = "insiphy"
version = "0.9.0"
description = "Intragenic synteny phylogenetics from genome sequence and annotation"
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.83",
    "networkx>=3.0",
    "scipy>=1.10",
]

[project.scripts]
insiphy = "insiphy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
